name: ENORPA Video Sayfasini Yayinla

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: GitHub Pages'i hazirla
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Sayfa dosyalarini paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Sayfayi yayinla
        id: deployment
        uses: actions/deploy-pages@v4
